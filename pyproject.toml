[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmuc-arena"
version = "0.7.2b3"
description = "Cross-platform 5v5/6v6 robot strategy arena with a 3D spectator"
license = {file = "LICENSE"}
authors = [{name = "RM-Arena"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "imageio-ffmpeg==0.6.0"]

[project.scripts]
rmuc-arena = "rmuc_arena.cli:main"

[tool.setuptools.packages.find]
include = ["rmuc_arena*"]

