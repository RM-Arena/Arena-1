<svg xmlns="http://www.w3.org/2000/svg" width="880" height="587" viewBox="0 0 880 587" role="img" aria-labelledby="title desc">
<title id="title">战术卡阅读指南</title><desc id="desc">战术卡包含身份、风格、阶段、地图路线、关键决策与已知局限。文字描述不等于实测胜率。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#b1c0ce"/></marker></defs>
<rect width="880" height="587" rx="16" fill="#101923"/>
<g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="36" y="49" font-size="28" fill="#e8c478" text-anchor="start" font-weight="600">怎样阅读一张战术卡</text><text x="36" y="86" font-size="20" fill="#b1c0ce" text-anchor="start" font-weight="400">下方为内容示意，不是策略性能测评或界面截图。</text><rect x="30" y="112" width="820" height="82" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="50" y="161" font-size="26" fill="#e8c478" text-anchor="start" font-weight="400">01</text><text x="117" y="144" font-size="23" fill="#eef3f8" text-anchor="start" font-weight="600">身份与打法</text><text x="117" y="176" font-size="20" fill="#b1c0ce" text-anchor="start" font-weight="400">谁开发、控制哪种机器人、主打进攻还是防守</text><rect x="30" y="210" width="820" height="82" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="50" y="259" font-size="26" fill="#e8c478" text-anchor="start" font-weight="400">02</text><text x="117" y="242" font-size="23" fill="#eef3f8" text-anchor="start" font-weight="600">风格与阶段</text><text x="117" y="274" font-size="20" fill="#b1c0ce" text-anchor="start" font-weight="400">雷达图说明侧重；时间线说明开局、中段与终局</text><rect x="30" y="308" width="820" height="82" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="50" y="357" font-size="26" fill="#e8c478" text-anchor="start" font-weight="400">03</text><text x="117" y="340" font-size="23" fill="#eef3f8" text-anchor="start" font-weight="600">地图与决策</text><text x="117" y="372" font-size="20" fill="#b1c0ce" text-anchor="start" font-weight="400">到哪里、走哪条路线、什么条件触发撤退或换目标</text><rect x="30" y="406" width="820" height="82" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="50" y="455" font-size="26" fill="#e8c478" text-anchor="start" font-weight="400">04</text><text x="117" y="438" font-size="23" fill="#eef3f8" text-anchor="start" font-weight="600">优点与局限</text><text x="117" y="470" font-size="20" fill="#b1c0ce" text-anchor="start" font-weight="400">已实现的能力、已知短板；结合真实回放验证</text><text x="36" y="553" font-size="21" fill="#b1c0ce" text-anchor="start" font-weight="400">说明由作者提供；读懂意图之后，仍要看实际行为和对局结果。</text></g></svg>
