<svg xmlns="http://www.w3.org/2000/svg" width="880" height="743" viewBox="0 0 880 743" role="img" aria-labelledby="title desc">
<title id="title">2027 四个控制点、控制度与临时控制示例</title><desc id="desc">红蓝双方各有前哨和基地控制点。前哨点由前哨卡及高地卡组成，基地点由基地卡及堡垒卡组成。同时控制两方同类点才累计控制度。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#b1c0ce"/></marker></defs>
<rect width="880" height="743" rx="16" fill="#101923"/>
<g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="36" y="48" font-size="28" fill="#e8c478" text-anchor="start" font-weight="600">2027：控制点与控制度</text><text x="36" y="84" font-size="21" fill="#b1c0ce" text-anchor="start" font-weight="400">每个控制点关联两处增益卡；控制状态不等于是否有人站着。</text><text x="48" y="127" font-size="24" fill="#fb8b94" text-anchor="start" font-weight="600">红方</text><rect x="30" y="146" width="395" height="100" rx="12" fill="#182430" stroke="#fb8b94" stroke-width="2"/><text x="50" y="183" font-size="23" fill="#fb8b94" text-anchor="start" font-weight="600">红方前哨控制点</text><text x="50" y="221" font-size="21" fill="#eef3f8" text-anchor="start" font-weight="400">前哨卡 + 中央高地卡</text><rect x="30" y="270" width="395" height="100" rx="12" fill="#182430" stroke="#fb8b94" stroke-width="2"/><text x="50" y="307" font-size="23" fill="#fb8b94" text-anchor="start" font-weight="600">红方基地控制点</text><text x="50" y="345" font-size="21" fill="#eef3f8" text-anchor="start" font-weight="400">基地卡 + 堡垒卡</text><text x="473" y="127" font-size="24" fill="#7cc4ff" text-anchor="start" font-weight="600">蓝方</text><rect x="455" y="146" width="395" height="100" rx="12" fill="#182430" stroke="#7cc4ff" stroke-width="2"/><text x="475" y="183" font-size="23" fill="#7cc4ff" text-anchor="start" font-weight="600">蓝方前哨控制点</text><text x="475" y="221" font-size="21" fill="#eef3f8" text-anchor="start" font-weight="400">前哨卡 + 中央高地卡</text><rect x="455" y="270" width="395" height="100" rx="12" fill="#182430" stroke="#7cc4ff" stroke-width="2"/><text x="475" y="307" font-size="23" fill="#7cc4ff" text-anchor="start" font-weight="600">蓝方基地控制点</text><text x="475" y="345" font-size="21" fill="#eef3f8" text-anchor="start" font-weight="400">基地卡 + 堡垒卡</text><rect x="30" y="397" width="820" height="106" rx="12" fill="#182430" stroke="#756447" stroke-width="2"/><text x="52" y="434" font-size="24" fill="#e8c478" text-anchor="start" font-weight="600">同时控制双方前哨 → 每秒 +1</text><text x="52" y="474" font-size="24" fill="#e8c478" text-anchor="start" font-weight="600">同时控制双方基地 → 每秒 +3</text><text x="36" y="545" font-size="22" fill="#eef3f8" text-anchor="start" font-weight="600">占领示例：从对方完全控制的前哨控制点开始</text><rect x="30" y="580" width="240" height="90" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="150" y="616" font-size="22" fill="#eef3f8" text-anchor="middle" font-weight="600">对方完全控制</text><text x="150" y="650" font-size="18" fill="#b1c0ce" text-anchor="middle" font-weight="400">我方独占有效卡片</text><rect x="320" y="580" width="240" height="90" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="440" y="616" font-size="22" fill="#eef3f8" text-anchor="middle" font-weight="600">我方临时控制</text><text x="440" y="650" font-size="18" fill="#b1c0ce" text-anchor="middle" font-weight="400">持续驻守可维持</text><rect x="610" y="580" width="240" height="90" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="730" y="616" font-size="22" fill="#eef3f8" text-anchor="middle" font-weight="600">对方完全控制</text><text x="730" y="650" font-size="18" fill="#b1c0ce" text-anchor="middle" font-weight="400">临时方离开后返回</text><path d="M275 623 L313 623" fill="none" stroke="#b1c0ce" stroke-width="2" marker-end="url(#arrow)"/><text x="291" y="571" font-size="18" fill="#b1c0ce" text-anchor="middle" font-weight="400">5 秒</text><path d="M565 623 L603 623" fill="none" stroke="#b1c0ce" stroke-width="2" marker-end="url(#arrow)"/><text x="584" y="571" font-size="18" fill="#b1c0ce" text-anchor="middle" font-weight="400">离开 5 秒</text><text x="36" y="711" font-size="19" fill="#b1c0ce" text-anchor="start" font-weight="400">击毁前哨还会改变控制状态并可能触发重建，完整条件见正文。</text></g></svg>
