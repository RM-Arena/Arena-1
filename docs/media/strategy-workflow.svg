<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" role="img" aria-labelledby="title desc">
<title id="title">策略从开发到比赛的工作流</title><desc id="desc">创建任务后开发、练习、提交，再选择固定版本对战，复盘后继续迭代。开发计时和比赛内时间是两个时钟。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#b1c0ce"/></marker></defs>
<rect width="880" height="580" rx="16" fill="#101923"/>
<g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="36" y="49" font-size="28" fill="#e8c478" text-anchor="start" font-weight="600">从战术想法到一份可参赛的程序</text><text x="36" y="99" font-size="22" fill="#e8c478" text-anchor="start" font-weight="400">开发阶段：人或 Agent 阅读、写代码、做实验</text><rect x="30" y="128" width="240" height="139" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="48" y="164" font-size="23" fill="#eef3f8" text-anchor="start" font-weight="600">1  创建任务</text><text x="48" y="206" font-size="18" fill="#eef3f8" text-anchor="start" font-weight="400">先选赛季、模式、阵容</text><text x="48" y="239" font-size="18" fill="#b1c0ce" text-anchor="start" font-weight="400">领取规则与任务目录</text><rect x="320" y="128" width="240" height="139" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="338" y="164" font-size="23" fill="#eef3f8" text-anchor="start" font-weight="600">2  开发与练习</text><text x="338" y="206" font-size="18" fill="#eef3f8" text-anchor="start" font-weight="400">修改 Python + 战术卡</text><text x="338" y="239" font-size="18" fill="#b1c0ce" text-anchor="start" font-weight="400">检查错误、结果与回放</text><rect x="610" y="128" width="240" height="139" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="628" y="164" font-size="23" fill="#eef3f8" text-anchor="start" font-weight="600">3  成功提交</text><text x="628" y="206" font-size="18" fill="#eef3f8" text-anchor="start" font-weight="400">在截止前保存版本</text><text x="628" y="239" font-size="18" fill="#b1c0ce" text-anchor="start" font-weight="400">只保存文件不等于提交</text><path d="M277 198 L313 198" fill="none" stroke="#b1c0ce" stroke-width="2" marker-end="url(#arrow)"/><path d="M567 198 L603 198" fill="none" stroke="#b1c0ce" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="322" font-size="22" fill="#e8c478" text-anchor="start" font-weight="400">比赛阶段：运行提交的代码，不逐帧调用语言模型</text><rect x="100" y="354" width="295" height="132" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><rect x="485" y="354" width="295" height="132" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="122" y="394" font-size="23" fill="#eef3f8" text-anchor="start" font-weight="600">4  选策略开始对战</text><text x="122" y="432" font-size="19" fill="#eef3f8" text-anchor="start" font-weight="400">程序每 0.1 秒读取观察</text><text x="122" y="463" font-size="19" fill="#b1c0ce" text-anchor="start" font-weight="400">引擎执行动作并裁定规则</text><text x="507" y="394" font-size="23" fill="#eef3f8" text-anchor="start" font-weight="600">5  看结果与回放</text><text x="507" y="432" font-size="19" fill="#eef3f8" text-anchor="start" font-weight="400">找出丢点、缺弹或卡路原因</text><text x="507" y="463" font-size="19" fill="#b1c0ce" text-anchor="start" font-weight="400">提出下一次明确的改进</text><path d="M404 420 L476 420" fill="none" stroke="#b1c0ce" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 275 V284 H20 V420 H90" fill="none" stroke="#b1c0ce" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="546" font-size="22" fill="#b1c0ce" text-anchor="start" font-weight="400">再次迭代：改一个问题 → 相同条件对照 → 提交新版本</text></g></svg>
