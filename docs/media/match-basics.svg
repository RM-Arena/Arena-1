<svg xmlns="http://www.w3.org/2000/svg" width="880" height="525" viewBox="0 0 880 525" role="img" aria-labelledby="title desc">
<title id="title">比赛的行动、资源与目标</title><desc id="desc">三个层次共同影响战术：机器人行动受资源约束，最终服务于基地保护与场上目标。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#b1c0ce"/></marker></defs>
<rect width="880" height="525" rx="16" fill="#101923"/>
<g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="36" y="49" font-size="28" fill="#e8c478" text-anchor="start" font-weight="600">看懂比赛：行动、资源、目标</text><rect x="30" y="78" width="820" height="112" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="50" y="122" font-size="28" fill="#e8c478" text-anchor="start" font-weight="600">01</text><text x="120" y="113" font-size="24" fill="#eef3f8" text-anchor="start" font-weight="600">机器人在做什么？</text><text x="120" y="145" font-size="22" fill="#eef3f8" text-anchor="start" font-weight="400">移动、瞄准、射击、搬运与配合</text><text x="120" y="174" font-size="19" fill="#b1c0ce" text-anchor="start" font-weight="400">先看路线与分工，再看是否打中。</text><rect x="30" y="204" width="820" height="112" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="50" y="248" font-size="28" fill="#e8c478" text-anchor="start" font-weight="600">02</text><text x="120" y="239" font-size="24" fill="#eef3f8" text-anchor="start" font-weight="600">为什么不能一直进攻？</text><text x="120" y="271" font-size="22" fill="#eef3f8" text-anchor="start" font-weight="400">血量、弹药、金币、热量与能量有限</text><text x="120" y="300" font-size="19" fill="#b1c0ce" text-anchor="start" font-weight="400">需要补给、降温，也要保护执行任务的队友。</text><rect x="30" y="330" width="820" height="112" rx="12" fill="#182430" stroke="#435568" stroke-width="2"/><text x="50" y="374" font-size="28" fill="#e8c478" text-anchor="start" font-weight="600">03</text><text x="120" y="365" font-size="24" fill="#eef3f8" text-anchor="start" font-weight="600">这些行动为谁创造优势？</text><text x="120" y="397" font-size="22" fill="#eef3f8" text-anchor="start" font-weight="400">保护基地、争夺控制点、积累控制度</text><text x="120" y="426" font-size="19" fill="#b1c0ce" text-anchor="start" font-weight="400">2027 到时先比控制度；击毁基地可提前结束。</text><text x="36" y="493" font-size="22" fill="#b1c0ce" text-anchor="start" font-weight="400">一局 420 秒（7 分钟） · 两个赛季的到时判据不同</text></g></svg>
