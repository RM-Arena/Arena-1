name: Desktop installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, arch: arm64}
          - {os: macos-15-intel, arch: x64}
          - {os: windows-latest, arch: x64}
          - {os: ubuntu-24.04, arch: x64}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            simulation
            legacy/v2/simulation
      - run: uv sync --locked
      - run: bun install --frozen-lockfile
      - run: bun run desktop:prepare
      - run: bun run desktop:dist
      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        run: |
          app_path=$(find dist/desktop -maxdepth 3 -name '*.app' -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
      - name: Collect installers and checksums
        run: uv run --locked python scripts/desktop/collect.py
      - uses: actions/upload-artifact@v4
        with:
          name: Arena-1-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/installers/*
          if-no-files-found: error
      - name: Smoke test packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          app_path=$(find dist/desktop -maxdepth 3 -name '*.app' -print -quit)
          test -n "$app_path"
          if [ "${{ matrix.arch }}" = x64 ]; then
            "$app_path/Contents/MacOS/Arena-1" --smoke-test --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader
          else
            "$app_path/Contents/MacOS/Arena-1" --smoke-test
          fi
      - name: Smoke test packaged app (Windows)
        if: runner.os == 'Windows'
        run: |
          $process = Start-Process "dist/desktop/win-unpacked/Arena-1.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Smoke test packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/desktop/*.deb
          xvfb-run --auto-servernum arena-1 --smoke-test --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require successful native regression checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | [.status, .conclusion] | @tsv')
            if [ "$result" = $'completed\tsuccess' ]; then exit 0; fi
            if [[ "$result" == completed* ]]; then echo "Native checks failed: $result"; exit 1; fi
            sleep 15
          done
          echo 'No successful native checks for this commit'; exit 1
      - uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Arena-1 $GITHUB_REF_NAME (Beta)" --prerelease --latest=false \
            --notes-file "$notes" installers/*/*
