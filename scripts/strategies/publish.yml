name: Publish strategy library
on:
  push:
    branches: [main]
    paths: ['strategies/**', 'publish.py', 'library.json', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: strategy-library
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python publish.py --tracked
      - name: Commit verified catalog and immutable bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json bundles/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish strategy library'
          git push origin HEAD:main
